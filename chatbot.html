<!DOCTYPE html>
<html>

<head>
  <title>chatbot</title>
  <link rel="stylesheet" href="main.css" />
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">
    function ChatInput() {
      return (
        <>
          <input placeholder="Enter a message" />
          <button>Send</button>
        </>
      )
    }

    function ChatMessage(props) {
      const msg = props.message;
      const sender =  props.sender;

      if (sender === "user") {
        return (
          <div class = "chat-message">
            <p class = "chat">{msg}</p>
            <img class = "image" src="images/luffy.jpg" width="50 " />
            
            </div>
        )
      }
      else{
         return (
        <div class = "chat-message">
         <img class = "image" src="images/messi.jpg" width="50 " />
         <p class = "chat">{msg}</p>
         </div>
      )
    }
      }

     

    const app = (
      <>
        <ChatInput />
        <ChatMessage message="Hello Chatbot" sender="user" />
        <ChatMessage message="Hello how can I help you?" sender="bot" />
        <ChatMessage message="Can you tell me more about yourself?" sender="user" />
        <ChatMessage message="I'm a chatbot, I'm here to help you!" sender="bot" />
      </>
    );

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(app);
  </script>
</body>

</html>
